name: Build and deploy Executive Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static API from committed data
        run: python pipeline/build_api.py
      - name: Check build
        run: |
          test -f site/api/v1/index.json
          test -f site/api/v1/documents.json
          test -f site/api/v1/documents/proc-563.json
          test -f site/api/v1/documents/eo-1003.json
          test -f site/api/v1/on-this-day/02-29.json
          test -f site/CNAME
          python -c "import json;m=json.load(open('site/api/v1/index.json'));print(m['counts'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
